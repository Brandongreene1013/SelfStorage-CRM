name: Market Intelligence Daily Brief

on:
  schedule:
    # Hourly calls let the API's Eastern-time scheduler run intraday news,
    # rates, and Fed refresh windows. The API is idempotent per ET hour and
    # remains the source of truth for DST/weekend behavior.
    - cron: '0 * * * *'
    # Keep both 6:30 offsets so the daily synthesized brief lands at the
    # intended time across daylight and standard time.
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

jobs:
  daily-market-brief:
    name: Refresh market intelligence on the Eastern schedule
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refresh due markets, news, active geographies, and daily brief
        env:
          MARKET_INTELLIGENCE_SECRET: ${{ secrets.MARKET_INTELLIGENCE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${MARKET_INTELLIGENCE_SECRET:-}" ]; then
            echo "::error::Add MARKET_INTELLIGENCE_SECRET as a GitHub Actions repository secret."
            exit 1
          fi

          mode="scheduled"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="daily-brief"
          fi

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 180 \
            -X POST \
            -H "content-type: application/json" \
            -H "x-intelligence-secret: ${MARKET_INTELLIGENCE_SECRET}" \
            -d "{\"mode\":\"${mode}\",\"trigger\":\"github_schedule\"}" \
            "https://self-storage-crm.vercel.app/api/market-intelligence"
